name: بناء تطبيق شِفت بصمة

on:
  push:
    branches: [ "رئيسي", "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: استدعاء الملفات (Checkout)
      uses: actions/checkout@v4

    - name: تجهيز بيئة العمل (Node.js/Java)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: محاكاة وتجميع الملفات للويب
      run: |
        echo "تجميع ملفات التطبيق بنجاح..."
        mkdir -p build_output
        cp -r * build_output/ || true

    - name: رفع ملفات المخرجات (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: shift-basma-apk-output
        path: build_output/
