name: Build Native Android APK

on:
  push:
    branches: [ "رئيسي", "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: استدعاء ملفات المشروع (Checkout)
      uses: actions/checkout@v4

    - name: إعداد بيئة جافا JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: إعداد بيئة Android SDK
      uses: android-actions/setup-android@v3

    - name: إنشاء مشروع Gradle تلقائي لترجمة ملفات الجافا
      run: |
        echo "جاري تجهيز هيكل بناء الـ Gradle..."
        
        # إنشاء ملف build.gradle أساسي لتجميع التطبيق
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        mkdir -p app/src/main
        
        # التأكد من نقل مجلداتك الحالية داخل هيكل تطبيق أندرويد القياسي
        if [ -d "res" ]; then
          mv res app/src/main/res
        fi
        
        if [ -f "AndroidManifest.xml" ]; then
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
        fi
        
        # نقل ملفات الجافا لمكانها الصحيح
        mkdir -p app/src/main/java/com/shift/alarm
        mv *.java app/src/main/java/com/shift/alarm/ 2>/dev/null || true

        # إنشاء ملف إعدادات التطبيق app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.shift.alarm'
            compileSdk 34
            defaultConfig {
                applicationId "com.shift.alarm"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # إنشاء ملف local.properties
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # إنشاء ملف gradlew wrapper في حال عدم وجوده
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

    - name: بناء وتشغيل حزمة الـ APK (Assemble Debug)
      run: ./gradlew assembleDebug

    - name: رفع ملف الـ APK الناتج كـ Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug-unified.apk
        if-no-files-found: warn
