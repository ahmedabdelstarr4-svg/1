name: Build Android APK

on:
  push:
    branches: [ "رئيسي", "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Organize Android Project Structure
      run: |
        echo "إعادة ترتيب الملفات لهيكل مشروع أندرويد القياسي..."
        
        # إنشاء هيكل مجلدات التطبيق
        mkdir -p app/src/main/java/com/shift/alarm
        mkdir -p app/src/main/res
        
        # نقل ملفات الجافا لمكانها الصحيح
        mv *.java app/src/main/java/com/shift/alarm/ 2>/dev/null || true
        
        # نقل ملف المانيفست لمكانه الصحيح
        if [ -f "AndroidManifest.xml" ]; then
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
        fi
        
        # نقل ملفات التخطيط res
        if [ -d "res" ]; then
          cp -r res/* app/src/main/res/ 2>/dev/null || true
        fi
        
        # إنشاء ملف إعدادات الجذر settings.gradle
        echo "include ':app'" > settings.gradle
        
        # إنشاء ملف build.gradle للجذر
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        # إنشاء ملف build.gradle للتطبيق app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.shift.alarm'
            compileSdk 34
            defaultConfig {
                applicationId "com.shift.alarm"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # ربط الـ SDK وإعداد Gradle Wrapper
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

    - name: Build APK (Assemble Debug)
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
